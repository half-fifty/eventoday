name: Build and Push Docker Images

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push BE image
        uses: docker/build-push-action@v5
        with:
          context: ./BE
          file: ./BE/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventoday-be:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/eventoday-be:latest

      - name: Build and push FE image
        uses: docker/build-push-action@v5
        with:
          context: ./FE
          file: ./FE/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            VITE_API_URL=https://eventoday.duckdns.org/api
          tags: |
            ghcr.io/${{ github.repository_owner }}/eventoday-fe:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/eventoday-fe:latest

      - name: Update manifest image tags
        run: |
          sed -i "s|eventoday-be:.*|eventoday-be:${{ github.sha }}|" k8s/backend.yaml
          sed -i "s|eventoday-fe:.*|eventoday-fe:${{ github.sha }}|" k8s/frontend.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "chore: bump image tag to ${{ github.sha }} [skip ci]" || echo "no changes to commit"
          git push origin HEAD:main
