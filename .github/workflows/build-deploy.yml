name: Build and Push Docker Images

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, arm64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push BE image
        run: |
          docker build \
            -t ghcr.io/half-fifty/eventoday-be:${{ github.sha }} \
            -t ghcr.io/half-fifty/eventoday-be:latest \
            -f BE/Dockerfile BE
          docker push ghcr.io/half-fifty/eventoday-be:${{ github.sha }}
          docker push ghcr.io/half-fifty/eventoday-be:latest

      - name: Build and push FE image
        run: |
          docker build \
            --build-arg VITE_API_URL=https://eventoday.duckdns.org/api \
            -t ghcr.io/half-fifty/eventoday-fe:${{ github.sha }} \
            -t ghcr.io/half-fifty/eventoday-fe:latest \
            -f FE/Dockerfile FE
          docker push ghcr.io/half-fifty/eventoday-fe:${{ github.sha }}
          docker push ghcr.io/half-fifty/eventoday-fe:latest

      - name: Update manifest image tags
        run: |
          sed -i "s|eventoday-be:.*|eventoday-be:${{ github.sha }}|" k8s/backend.yaml
          sed -i "s|eventoday-fe:.*|eventoday-fe:${{ github.sha }}|" k8s/frontend.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "chore: bump image tag to ${{ github.sha }} [skip ci]" || echo "no changes to commit"
          git push origin HEAD:dev

      - name: Sync k8s Secret
        run: |
          sudo kubectl create secret generic eventoday-secret \
            --namespace eventoday \
            --from-literal=POSTGRES_USER=expo_user \
            --from-literal=POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --from-literal=GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }} \
            --from-literal=GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }} \
            --dry-run=client -o yaml | sudo kubectl apply -f -

      - name: Restart backend to pick up secret changes
        run: sudo kubectl rollout restart deployment/eventoday-be -n eventoday
