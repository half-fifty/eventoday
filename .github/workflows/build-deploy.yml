name: Build and Push Docker Images

on:
  push:
    branches:
      - dev
    paths-ignore:
      - 'k8s/**'
      - 'argocd/**'
      - 'docs/**'
      - '**.md'

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: [self-hosted, arm64]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate deployment configuration
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NTS_BUSINESS_API_KEY: ${{ secrets.NTS_BUSINESS_API_KEY }}
          ORDER_ACCESS_TOKEN_SECRET: ${{ secrets.ORDER_ACCESS_TOKEN_SECRET }}
          KAKAO_MAP_REST_API_KEY: ${{ secrets.KAKAO_MAP_REST_API_KEY }}
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_KAKAO_MAP_JS_KEY: ${{ vars.VITE_KAKAO_MAP_JS_KEY }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
        run: |
          required=(
            POSTGRES_PASSWORD JWT_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET
            NTS_BUSINESS_API_KEY ORDER_ACCESS_TOKEN_SECRET KAKAO_MAP_REST_API_KEY
            VITE_API_BASE_URL VITE_KAKAO_MAP_JS_KEY FRONTEND_URL COOKIE_SECURE
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required deployment setting is missing: $name"
              exit 1
            fi
          done

      - name: Build and push BE image
        run: |
          docker build \
            -t ghcr.io/half-fifty/eventoday-be:${{ github.sha }} \
            -t ghcr.io/half-fifty/eventoday-be:latest \
            -f BE/Dockerfile BE
          docker push ghcr.io/half-fifty/eventoday-be:${{ github.sha }}
          docker push ghcr.io/half-fifty/eventoday-be:latest

      - name: Build and push FE image
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_KAKAO_MAP_JS_KEY: ${{ vars.VITE_KAKAO_MAP_JS_KEY }}
        run: |
          docker build \
            --build-arg "VITE_API_BASE_URL=$VITE_API_BASE_URL" \
            --build-arg "VITE_KAKAO_MAP_JS_KEY=$VITE_KAKAO_MAP_JS_KEY" \
            -t ghcr.io/half-fifty/eventoday-fe:${{ github.sha }} \
            -t ghcr.io/half-fifty/eventoday-fe:latest \
            -f FE/Dockerfile FE
          docker push ghcr.io/half-fifty/eventoday-fe:${{ github.sha }}
          docker push ghcr.io/half-fifty/eventoday-fe:latest

      - name: Update manifest image tags
        run: |
          sed -i "s|eventoday-be:.*|eventoday-be:${{ github.sha }}|" k8s/backend.yaml
          sed -i "s|eventoday-fe:.*|eventoday-fe:${{ github.sha }}|" k8s/frontend.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/backend.yaml k8s/frontend.yaml
          git commit -m "chore: bump image tag to ${{ github.sha }} [skip ci]" || echo "no changes to commit"
          git push origin HEAD:dev

      - name: Sync k8s Secret
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          NTS_BUSINESS_API_KEY: ${{ secrets.NTS_BUSINESS_API_KEY }}
          ORDER_ACCESS_TOKEN_SECRET: ${{ secrets.ORDER_ACCESS_TOKEN_SECRET }}
          KAKAO_MAP_REST_API_KEY: ${{ secrets.KAKAO_MAP_REST_API_KEY }}
        run: |
          {
            printf 'POSTGRES_USER=%s\n' 'expo_user'
            printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD"
            printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
            printf 'GOOGLE_CLIENT_ID=%s\n' "$GOOGLE_CLIENT_ID"
            printf 'GOOGLE_CLIENT_SECRET=%s\n' "$GOOGLE_CLIENT_SECRET"
            printf 'NTS_BUSINESS_API_KEY=%s\n' "$NTS_BUSINESS_API_KEY"
            printf 'ORDER_ACCESS_TOKEN_SECRET=%s\n' "$ORDER_ACCESS_TOKEN_SECRET"
            printf 'KAKAO_MAP_REST_API_KEY=%s\n' "$KAKAO_MAP_REST_API_KEY"
          } | sudo kubectl create secret generic eventoday-secret \
            --namespace eventoday \
            --from-env-file=/dev/stdin \
            --dry-run=client -o yaml | sudo kubectl apply -f -

      - name: Sync backend config env vars
        env:
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          COOKIE_SECURE: ${{ vars.COOKIE_SECURE }}
        run: |
          sudo kubectl set env deployment/eventoday-be -n eventoday \
            FRONTEND_URL="$FRONTEND_URL" \
            COOKIE_SECURE="$COOKIE_SECURE"

      - name: Restart backend to pick up secret changes
        run: sudo kubectl rollout restart deployment/eventoday-be -n eventoday
