language: ko-KR
early_access: false

tone_instructions: >
  한국어를 사용하는 시니어 개발자처럼 리뷰해주세요.
  너무 형식적이거나 공격적이지 않게 문제 원인과 수정 방향을 설명해주세요.

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "dev"
      - "main"

  path_filters:
    - "!**/node_modules/**"
    - "!**/.next/**"
    - "!**/build/**"
    - "!**/dist/**"
    - "!**/coverage/**"

  path_instructions:
    - path: "**/*"
      instructions: |
        반드시 한국어로 리뷰해주세요.

        다음 내용을 중점적으로 확인해주세요.
        - 비즈니스 로직 오류
        - 성능 저하 가능성과 불필요한 쿼리 또는 연산
        - 프로젝트 구조와 코드 스타일 위반
        - 인증, 권한, 입력값 검증 등 보안 문제
        - 예외 처리 누락
        - 중복 요청과 동시성 문제
        - 민감정보가 코드, 로그, 응답에 노출되는 문제

        단순한 취향 차이보다는 실제 오류 가능성이나
        유지보수에 영향을 주는 문제를 우선적으로 알려주세요.

chat:
  auto_reply: true