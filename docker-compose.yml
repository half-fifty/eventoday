name: eventoday

services:
  redis:
    image: redis:7-alpine
    container_name: eventoday_Redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  minio:
    image: minio/minio
    container_name: eventoday_MinIO
    restart: unless-stopped
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # 웹 콘솔
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-eventoday}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-eventoday}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  redis_data:
  minio_data:
