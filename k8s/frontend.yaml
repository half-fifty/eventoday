apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventoday-fe
  namespace: eventoday
  labels:
    app: eventoday-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventoday-fe
  template:
    metadata:
      labels:
        app: eventoday-fe
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: eventoday-fe
          image: ghcr.io/half-fifty/eventoday-fe:665a7f3461f48eb40b1e3c92d07e21eb9e53999b
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: eventoday-fe
  namespace: eventoday
spec:
  selector:
    app: eventoday-fe
  ports:
    - port: 80
      targetPort: 80
