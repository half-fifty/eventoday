apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventoday-fe
  namespace: eventoday
  labels:
    app: eventoday-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventoday-fe
  template:
    metadata:
      labels:
        app: eventoday-fe
    spec:
      containers:
        - name: eventoday-fe
          image: ghcr.io/half-fifty/eventoday-fe:151b7f43899389f1ad4b59f5a441d7e1cf3843b2
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: eventoday-fe
  namespace: eventoday
spec:
  selector:
    app: eventoday-fe
  ports:
    - port: 80
      targetPort: 80
