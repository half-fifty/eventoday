apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventoday-fe
  namespace: eventoday
  labels:
    app: eventoday-fe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eventoday-fe
  template:
    metadata:
      labels:
        app: eventoday-fe
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: eventoday-fe
          image: ghcr.io/half-fifty/eventoday-fe:78aa80ecd9b27cf856f57573e9716b94763323da
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: eventoday-fe
  namespace: eventoday
spec:
  selector:
    app: eventoday-fe
  ports:
    - port: 80
      targetPort: 80
