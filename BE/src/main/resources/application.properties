spring.application.name=BE

# 배포 환경의 Ingress가 /api 프리픽스로 라우팅하므로 컨텍스트 경로를 맞춘다.
server.servlet.context-path=/api

# PostgreSQL (로컬 기본값. 배포 환경은 DB_URL을 명시적으로 주입한다.)
spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:expo_platform}}
spring.datasource.username=${POSTGRES_USER:expo_user}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema changes are managed by Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# 여러 명이 각자 로컬에서 공유 DB에 마이그레이션을 실행하다 보니, PR 머지 순서와
# 실제 실행 순서가 어긋나는 경우가 있다. 순서가 안 맞아도 부팅이 막히지 않도록 허용한다.
spring.flyway.out-of-order=true

# Redis (로컬 docker-compose)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Naver OAuth2
spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${SMTP_FROM:${SMTP_USERNAME:}}
app.mail.from-name=${SMTP_FROM_NAME:EVENTODAY}

spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response

# Kakao OAuth2
spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=1209600000

order-access-token.secret=${ORDER_ACCESS_TOKEN_SECRET}

toss-payments.secret-key=${TOSS_SECRET_KEY}
toss-payments.base-url=${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
toss-payments.connect-timeout-ms=3000
toss-payments.read-timeout-ms=5000
toss-payments.webhook-connect-timeout-ms=1500
toss-payments.webhook-read-timeout-ms=3000

payment.finalization-lock-timeout-ms=5000
payment.webhook-finalization-lock-timeout-ms=3000
payment.confirm-inflight-ttl=${PAYMENT_CONFIRM_INFLIGHT_TTL:30s}
payment.virtual-account-reconciliation.enabled=${PAYMENT_VA_RECONCILIATION_ENABLED:true}
payment.virtual-account-reconciliation.fixed-delay=${PAYMENT_VA_RECONCILIATION_FIXED_DELAY:60s}
payment.virtual-account-reconciliation.age-threshold=${PAYMENT_VA_RECONCILIATION_AGE_THRESHOLD:60s}
payment.virtual-account-reconciliation.batch-size=${PAYMENT_VA_RECONCILIATION_BATCH_SIZE:50}

# Ticket order reliability controls.
# 120s is deliberately longer than the observed 10s client timeout, while still
# far shorter than payment expiration; Redis is only an in-flight/admission lease.
ticket-order.reliability.inflight-ttl=120s
ticket-order.reliability.idempotency-processing-ttl=15m
ticket-order.reliability.admission.max-in-flight-per-event=${TICKET_ORDER_ADMISSION_MAX_IN_FLIGHT_PER_EVENT:50}
ticket-order.reliability.admission.lease-ttl=${TICKET_ORDER_ADMISSION_LEASE_TTL:120s}
ticket-order.reliability.admission.retry-after-seconds=${TICKET_ORDER_ADMISSION_RETRY_AFTER_SECONDS:1}

advertisement.event-ad-price=${EVENT_AD_PRICE:100000}
advertisement.payment-expiry=${EVENT_AD_PAYMENT_EXPIRY:PT30M}

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:false}

# AWS S3 파일 저장소 설정
cloud.aws.s3.bucket=${AWS_S3_BUCKET:expo-platform-files}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY:}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY:}
cloud.aws.s3.endpoint=${STORAGE_ENDPOINT:}

# 멀티파트 파일 업로드 크기 제한
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# NTS business registration verification API
external.nts-business-api.base-url=https://api.odcloud.kr/api/nts-businessman/v1
external.nts-business-api.service-key=${NTS_BUSINESS_API_KEY}
external.nts-business-api.connect-timeout=${NTS_BUSINESS_API_CONNECT_TIMEOUT:3s}
external.nts-business-api.read-timeout=${NTS_BUSINESS_API_READ_TIMEOUT:5s}

# 부스 리뷰 AI 요약 (Gemini의 OpenAI 호환 엔드포인트 사용 — 요청/응답 포맷이 OpenAI Chat Completions와 동일)
# reasoning-effort: Gemini 3.x "thinking" 계열 모델은 기본값일 때 max_tokens를 내부 추론에 다 써버려
# 실제 답변이 비거나(finish_reason=length) 엉뚱한 내용을 낼 수 있어 반드시 명시적으로 낮춰야 한다.
# gemini-3.5-flash-lite는 "none"을 지원하지 않고 400을 반환해서(실측 확인) "low"를 기본값으로 쓴다.
# 실 OpenAI(gpt-4o-mini 등)로 되돌릴 경우 이 값을 비워야 한다 — 해당 파라미터 미지원 모델은 400을 반환한다.
external.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai
external.openai.api-key=${GEMINI_API_KEY:}
external.openai.model=${OPENAI_REVIEW_SUMMARY_MODEL:gemini-3.5-flash-lite}
external.openai.reasoning-effort=${OPENAI_REASONING_EFFORT:low}
external.openai.connect-timeout=${OPENAI_CONNECT_TIMEOUT:3s}
external.openai.read-timeout=${OPENAI_READ_TIMEOUT:10s}

# 평면도 부스 자동 배치 (Gemini 네이티브 API, bounding box 검출용 responseSchema 사용)
# 실측(2026-08-12): 3.1 flash-lite가 3.5 flash-lite보다 이 작업에서 더 정밀도가 높았다
# (3.5는 치수/시설명을 부스로 오인하거나 무한 반복 생성에 빠지는 사례가 재현됨).
external.gemini-vision.base-url=https://generativelanguage.googleapis.com/v1beta
external.gemini-vision.api-key=${GEMINI_API_KEY:}
external.gemini-vision.model=${GEMINI_VISION_MODEL:gemini-3.1-flash-lite}
external.gemini-vision.connect-timeout=${GEMINI_VISION_CONNECT_TIMEOUT:3s}
external.gemini-vision.read-timeout=${GEMINI_VISION_READ_TIMEOUT:45s}

# Kakao Map
kakao.map.rest-api-key=${KAKAO_MAP_REST_API_KEY:}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest

# Kafka producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer

# Kafka consumer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer

# Kafka JSON message type
spring.kafka.consumer.properties[spring.json.value.default.type]=com.min.edu.notification.dto.NotificationEventDto
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.min.edu.notification.dto

# Pageable 설정
spring.data.web.pageable.max-page-size=50
spring.data.web.pageable.default-page-size=10
