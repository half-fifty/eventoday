spring.application.name=BE

# 배포 환경의 Ingress가 /api 프리픽스로 라우팅하므로 컨텍스트 경로를 맞춘다.
server.servlet.context-path=/api

# PostgreSQL (팀 공유 원격 DB. .env의 POSTGRES_PASSWORD 필요)
spring.datasource.url=${DB_URL:jdbc:postgresql://${POSTGRES_HOST:161.33.151.67}:${POSTGRES_PORT:5432}/${POSTGRES_DB:expo_platform}}
spring.datasource.username=${POSTGRES_USER:expo_user}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema changes are managed by Flyway.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Redis (로컬 docker-compose)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=1209600000
order-access-token.secret=${ORDER_ACCESS_TOKEN_SECRET}
toss-payments.secret-key=${TOSS_SECRET_KEY}
toss-payments.base-url=${TOSS_PAYMENTS_BASE_URL:https://api.tosspayments.com}
toss-payments.connect-timeout-ms=3000
toss-payments.read-timeout-ms=5000
payment.finalization-lock-timeout-ms=5000

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cookie-secure=${COOKIE_SECURE:false}
