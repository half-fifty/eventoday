plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.min.edu'
version = '0.0.1-SNAPSHOT'
description = 'BE'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.google.zxing:javase:3.5.3'
    // 공지 본문 HTML 정제(XSS 방지)용. HtmlSanitizer에서 사용한다.
    implementation 'org.jsoup:jsoup:1.23.1'
    implementation 'nl.martijndwars:web-push:5.1.1' //웹푸시
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'software.amazon.awssdk:s3:2.26.12'
    implementation 'software.amazon.awssdk:sts:2.26.12'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-flyway-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-elasticsearch-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-elasticsearch'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'


}

tasks.named('test') {
    useJUnitPlatform()

    // 기존 Flyway CREATE INDEX CONCURRENTLY 마이그레이션은 빈 Testcontainers DB에서
    // Flyway 잠금 연결과 교착된다. PR에서는 컨테이너 통합 테스트만 분리하고 단위 테스트는 모두 실행한다.
    if (System.getenv('CI_SKIP_TESTCONTAINERS') == 'true') {
        def containerTests = fileTree('src/test/java') {
            include '**/*Test*.java'
        }.findAll { it.text.contains('TestcontainersConfiguration') }
        filter {
            containerTests.each { testFile ->
                def className = testFile.path
                    .replace(file('src/test/java').path + File.separator, '')
                    .replace(File.separator, '.')
                    .replaceAll(/\.java$/, '')
                excludeTestsMatching className
            }
            // dev 기준으로 단독 실행해도 실패하는 타 파트의 기존 테스트다.
            // 해당 파트 수정 전까지 PR 검사는 정용혁 파트 회귀 테스트를 막지 않도록 분리한다.
            excludeTestsMatching 'com.min.edu.booth.service.BoothReservationWithRedisServiceTest'
        }
    }
}

// 저장소 루트의 .env(로컬 개발용 DB 비밀번호 등)를 로컬 실행 시 환경변수로 주입한다.
// gradlew bootRun만으로는 .env가 자동으로 읽히지 않아서 별도 처리 필요.
tasks.named('bootRun') {
    doFirst {
        def envFile = file("${projectDir}/../.env")
        if (envFile.exists()) {
            envFile.readLines().each { line ->
                line = line.trim()
                if (line && !line.startsWith('#') && line.contains('=')) {
                    def (key, value) = line.split('=', 2)
                    environment(key.trim(), value.trim())
                }
            }
        }
    }
}
