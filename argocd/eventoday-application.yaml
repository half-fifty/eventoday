apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: eventoday
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/half-fifty/eventoday.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: eventoday

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
